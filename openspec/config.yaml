schema: spec-driven

context: |
  Tech stack: TypeScript 7, React 19, Vite 8, PWA (vite-plugin-pwa), HTML5-QRCode, Tesseract.js 7
  Architecture: Clean Architecture / DDD (domain entities, value objects, domain services, infrastructure repositories & OCR, React UI)
  Testing: Vitest 5 (unit & integration), tsc --noEmit
  Persistence: LocalStorage, SQLite

strict_tdd: true

testing:
  runner: vitest run
  typecheck: tsc --noEmit
  build: tsc && vite build
  projects:
    - path: .
      stack: typescript-react-vite
      test_command: vitest run
      typecheck_command: tsc --noEmit
      framework: vitest

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow Clean Architecture and DDD layer boundaries
      - Keep domain pure with no external or React dependencies
    tdd: true
    test_command: vitest run
  verify:
    test_command: vitest run
    typecheck_command: tsc --noEmit
    build_command: tsc && vite build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
